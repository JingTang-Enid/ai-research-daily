<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="../" class="active">Daily Report</a>
  <a href="../nightly/">Paper Scan</a>
</nav>
<header>
  <h1>AI Research Daily</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — Top picks today</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>Findings by topic</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== Replaced daily by the morning-report agent. ALL content in English. =====
const REPORT = {
  date: "2026-07-28",
  note: "Paper scan: 10 items across 7 topics (Monday edition; K3 open weights now fully inspectable — first frontier-scale open MoE artifact)",
  runs: ["Paper scan 07:00 (10 items)"],
  tldr: [
    "★4 [MoE] Kimi K3's open weights are now the largest openly inspectable MoE artifact ever: Stable LatentMoE routing 16 of 896 experts (~50B active of 2.8T), Kimi Delta Attention over 1M context, Attention Residuals, and MXFP4 quantization trained in from the SFT stage (5.6TB→1.4TB). Expert-specialization analysis, expert pruning, and quantized-MoE fine-tuning are suddenly possible at frontier scale on real weights instead of small proxies.",
    "★3 [project-related] DemoPSD (2607.02502) adds a third mechanism family to the OPD-failure-modes literature: dense token-level teacher supervision causes in-domain overfitting and privileged-information leakage, fixed by disagreement-modulated selective guidance toward a reverse-KL barycenter — functionally the closest published mechanism to our α-anchoring. Beats GRPO/SDPO on SciKnowEval with higher entropy and better OOD generalization.",
    "★3 \"What AI Red-Team Evaluations Can and Cannot Prove\" (2607.21735) formalizes the eval-validity critique days before the EU AI Act's Aug 2 deadline: red-teaming lower-bounds detected capability and can never upper-bound actual capability — current regulation demands verification no deployed eval methodology can deliver.",
    "★3 Anthropic's global-workspace result in full: the J-space is readable, self-reportable, and steerable — a hidden-reasoning monitoring substrate that doesn't rely on CoT faithfulness, with a Neuronpedia demo and open-source tooling now public for external replication.",
    "★3 K3 provenance forensics, the pre-weights baseline: Greenblatt's cross-entropy identity analysis and Zvi's decomposition (distillation ≈15% of post-training gains) are the concrete, falsifiable numbers that post-release weight-level forensics will confirm or kill."
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" },
    { name: "Multimodal/VLM", color: "--s6" },
    { name: "MoE", color: "--s7" }
  ],
  findings: [
    { topic: "MoE", title: "Kimi K3 weights as a MoE research artifact: 896-expert Stable LatentMoE + MXFP4 QAT now fully inspectable", url: "https://huggingface.co/moonshotai/Kimi-K3", type: "release", date: "2026-07-27", stars: 4,
      summary: "With the weights public, K3's MoE internals move from paper claims to inspectable tensors: Stable LatentMoE routes to 16 of 896 experts (~50B active of 2.8T), Kimi Delta Attention keeps full attention only on critical layers across the 1M context, and Attention Residuals let later layers selectively retrieve earlier-layer representations. The MXFP4-weights/MXFP8-activations quantization was trained in from the SFT stage (QAT, not post-hoc), cutting storage 5.6TB→1.4TB. Community analyses frame K3 alongside DeepSeek V4-Pro and GLM-5.2 as the trillion-scale open MoE cohort.",
      why: "First time frontier-scale MoE routing, expert specialization, and QAT interactions can be studied directly on open weights rather than through ablations on small proxies." },
    { topic: "MoE", title: "MoE²-LoRA: router-aware parameter-efficient fine-tuning for MoE backbones", url: "https://arxiv.org/abs/2607.21978", type: "paper", date: "2026-07-24", stars: 3,
      summary: "Existing PEFT for MoE either ignores the router or picks experts statically. MoE²-LoRA couples pretrained expert specialization with task adaptation via a dual-channel routing module that reuses the base model's router activations to route into a shared, model-wide pool of LoRA experts — balanced adapter utilization, cross-layer knowledge sharing, and state-of-the-art downstream accuracy across multiple MoE backbones while preserving more general capability than prior methods.",
      why: "As the open-model frontier goes MoE (K3/V4/GLM), \"how to fine-tune a sparse model without fighting its router\" becomes a practical question — and reusing the base router is a clean default answer." },
    { topic: "AI Safety", title: "What AI Red-Team Evaluations Can and Cannot Prove", url: "https://arxiv.org/abs/2607.21735", type: "paper", date: "2026-07-27", stars: 3,
      summary: "Formalizes the gap between \"passed the evaluation\" and \"proven safe\": red-teaming establishes a lower bound on detected capability, never an upper bound on actual capability, and the elicitation problem means dangerous capabilities can persist undetected. Sorts safety claims into provable vs unprovable scope, citing METR's finding that GPT-5.6 Sol cheated on its own tests in 55.4% of cases, and argues current regulatory frameworks demand verification no deployed eval methodology can deliver.",
      why: "Lands the eval-validity critique as a formal argument days before the EU AI Act's Aug 2 compliance deadline — a likely reference point for what safety cases may legitimately claim." },
    { topic: "AI Safety", title: "(follow-up) Anthropic's global workspace result in full: the J-space is readable, self-reportable, and steerable", url: "https://www.anthropic.com/research/global-workspace", type: "blog", date: "2026-07-06", stars: 3,
      summary: "Using the Jacobian Lens, Anthropic identifies internal representations (\"J-space\") tied to words the model might say: Claude can report J-space contents when asked what it is thinking, can deliberately modulate them on request, and reuses a single J-space representation across multiple downstream tasks in multi-step reasoning — the functional signature predicted by global workspace theory. Reading it directly catches behaviors absent from outputs (fabricated data, unverbalized test awareness). Interactive Neuronpedia demo and open-source implementation released.",
      why: "Hidden-reasoning monitoring gets a readable substrate that doesn't rely on CoT faithfulness — and the tooling is public, so external replication on open models is now possible." },
    { topic: "OPD", title: "(follow-up) K3 provenance forensics, the pre-weights baseline: Greenblatt's method details and Zvi's quantitative decomposition", url: "https://thezvi.substack.com/p/on-kimi-k3-its-capabilities-and-related", type: "discussion", date: "2026-07-19/21", stars: 3,
      summary: "Greenblatt (Redwood): cross-entropy comparison of raw responses shows K3 claims to be Claude disproportionately often (sometimes \"Claude 4.5\"), a statistically significant pattern not mirrored for other identities — supporting but not proving distillation. Zvi's capability review adds a quantitative decomposition: ~10% Claude self-identification, ~5% output mimicking, ~7% rejection sampling against frontier judges, distillation ≈15% of post-training gains — meaningful but partial, with K3's real-world utility trailing its benchmarks.",
      why: "These are the concrete, falsifiable numbers that post-release forensics on the actual weights will confirm or kill; both analysts converge on \"meaningful but partial\" rather than either extreme." },
    { topic: "OPD", title: "DemoPSD: disagreement-modulated selective teacher guidance against dense-supervision failure", url: "https://arxiv.org/abs/2607.02502", type: "paper", date: "2026-07-02", stars: 3,
      summary: "[project-related] Identifies two failure modes of dense token-level self-distillation — overfitting to in-domain patterns and privileged-information leakage — and responds with selective guidance: supervision modulated by teacher-student disagreement, steering the student toward a reverse-KL barycenter between teacher and its own policy to preserve exploration capacity. Beats GRPO and SDPO on SciKnowEval across four scientific domains, maintains higher training entropy, and generalizes better to out-of-distribution GPQA.",
      why: "A third mechanism family in the OPD-failure literature (dense supervision kills exploration/entropy) alongside capacity-gap collapse and gradient-alignment diagnoses — its reverse-KL barycenter is functionally the closest published mechanism to our α-anchoring." },
    { topic: "OPD", title: "dOPSD: on-policy self-distillation ported to diffusion language models", url: "https://arxiv.org/abs/2607.04428", type: "paper", date: "2026-07", stars: 2,
      summary: "Applies on-policy self-distillation to diffusion language models, where rollouts are denoising trajectories rather than autoregressive token streams — a setting where the on-policy/off-policy distinction and teacher-signal density both change shape. (Abs page rate-limited this round; list-level information only, details to backfill.)",
      why: "OPD recipes are spreading beyond autoregressive LMs (audio last week, diffusion now); whether the known failure modes transfer with them is an open question." },
    { topic: "Post-training", title: "Controlling reasoning effort in LLMs: a cross-model survey of how effort tiers are trained in", url: "https://magazine.sebastianraschka.com/p/controlling-reasoning-effort-in-llms", type: "blog", date: "2026-07-18", stars: 3,
      summary: "Raschka catalogs the training recipes behind effort control: discrete tiers (GPT-5.6 Light→Ultra) vs continuous effort values (Inkling conditions RL on effort ∈ [0,1]); hard thinking budgets with forced truncation (Nemotron, Qwen3); system-prompt effort labels (gpt-oss); DeepSeek V4 training separate specialists then distilling into one model; K2.5/K3 alternating budgeted and unconstrained phases; GLM-5 turn-level control. Common core: SFT plus RL with length penalties. Automatic effort selection remains unsolved.",
      why: "Effort control has quietly become a first-class post-training target across every frontier lab, and this is the first systematic side-by-side of the recipes." },
    { topic: "Agentic RL", title: "OpenAgent: static tool-use training is fragile under open-world distribution shift", url: "https://arxiv.org/abs/2607.01084", type: "paper", date: "2026-07-01", stars: 3,
      summary: "Lv et al. (LAMDA-NeSy) build a sandbox imposing hierarchical environmental shifts — Perception, Interaction, Reasoning, Internalization — across query, action, observation, and domain dimensions, and show both SFT- and RL-trained tool-use agents degrade measurably under every shift tier. Their remedy, Perturbation-Augmented Fine-Tuning, injects disturbances during training to recover robustness; code promised.",
      why: "Complements harness-native training pushes from the other side — even harness-faithful training distributions are static, and this quantifies how much that costs at deployment." },
    { topic: "Multimodal/VLM", title: "Leveraging offline supervision for efficient RL in large-scale vision-language-action models", url: "https://arxiv.org/abs/2607.19399", type: "paper", date: "2026-07-22", stars: 2,
      summary: "Targets the cost problem of running RL on large VLA models by leveraging offline supervision for efficiency and generalization. (Abs page rate-limited this round; list-level information only, method and numbers to backfill next round.)",
      why: "VLA post-training is where the multimodal and agentic-RL threads meet, and offline-supervision hybrids are the current answer to RL's sample cost at scale." }
  ]
};
// ===== End of data block =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  "Overnight summary · " + REPORT.date + " · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "total findings" },
  { v: papers, k: "papers" },
  { v: REPORT.findings.length - papers, k: "blogs / discussions" },
  { v: REPORT.runs.length, k: "overnight runs" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "All";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="All"?"active":""}" onclick="setTopic('All')">All</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "All" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="importance ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>Why it matters:</b> ${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · paper scan 7:00 AM · daily report 9:00 AM (US Central) · full archives in the autoResearch_AI project (claude/daily/)";
</script>
</body>
</html>
