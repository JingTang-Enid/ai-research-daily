<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research 日报 Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav style="display:flex;gap:16px;align-items:center;margin-bottom:18px;font-size:13px;">
  <span style="font-weight:700;">autoResearch_AI</span>
  <a href="../" style="color:var(--ink);text-decoration:none;font-weight:600;">今日日报</a>
  <a href="../nightly/" style="color:var(--muted);text-decoration:none;">论文扫描</a>
  <a href="../lab/" style="color:var(--muted);text-decoration:none;">实验室</a>
  <a href="./" style="color:var(--muted);text-decoration:none;">历史存档</a>
</nav>
<header>
  <h1>AI Research 日报</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — 今天最值得看</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>各主题发现数</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== 每日由早报 agent 替换以下数据块 =====
const REPORT = {
  date: "2026-07-26",
  note: "实验:λ×gap 主图数据落地(45 runs)——α=1 处处最优,on-policy RKL 在 toy 中纯有害(噪声 teacher 下 mix50 也不敌纯 SeqKD),可救难度在容量悬崖激增;pythia 轨升级为论文成败关键实验,叙事方向 (a)/(b) 等用户选,runner 第五晚离线请重启 · 论文扫描 10 条(周六,以实验室发布与补录为主)",
  runs: ["实验夜班 02:00 (云端 λ×gap 主图 + noisy-teacher)", "论文扫描 07:00 (10 条)"],
  tldr: [
    "实验里程碑:OPD-Gap 论文主图数据落地——λ-锚定 × capacity-gap 45 runs + noisy-teacher 变体:α=1(纯 SeqKD)处处最优,on-policy reverse-KL 分量在 toy 中找不到任何有益 regime(干净与噪声 teacher 皆然);恢复曲线随 gap 非单调(7.6× 凹 / 2.0× 线性 / 28× 凸),可救难度在容量悬崖激增;tNLL 目标-结果背离覆盖全网格。叙事方向 (a) 崩溃分级 vs (b) 必要条件研究,等你 comment;runner 第五晚离线,请重启 start.command。",
    "★4 Anthropic 发布 Claude Opus 5(7/24 补录):1M 上下文、$5/$25\"近 Fable 5 智能半价\"、effort 五档(xhigh/max 强制 thinking);Frontier-Bench 第一;自动行为审计称其\"迄今最对齐模型\"——对齐度首次成为发布主打卖点。",
    "★4 [课题相关] Apple《Unmasking On-Policy Distillation》:token 级\"理想梯度\"+ gradient alignment score 诊断 OPD 何时帮何时伤,发现蒸馏信号在错误 rollout 上远比正确 rollout 对齐——与本课题 tNLL 指标同族异构,related work 必引,今晚必读确认有无 gap sweep。",
    "★3 Kimi K3 权重 7/27 00:00 UTC 释出倒计时:\"15 天证据缺口\"成反方核心论据(\"检测到蒸馏活动\"≠\"模型由蒸馏训成\");Moonshots 播客把开源不可逆 + 护栏攻防不对称推上主轴。权重落地后取证方法首次可独立复核。",
    "★3 agent 记忆两极解法同场:Sakana RHI 迭代自改进 harness(低 effort 胜 max-effort、省 60% 成本);Duke PRO-LONG 全量日志+程序化检索 ARC-AGI-3 +18pp;AttriMem 用归因当 process reward 破记忆 credit assignment。"
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" }
  ],
  findings: [
    { topic: "Post-training", title: "Anthropic 发布 Claude Opus 5:1M 上下文、effort 五档、\"近 Fable 5 智能半价\"", url: "https://www.anthropic.com/news/claude-opus-5", type: "release", date: "2026-07-24", stars: 4,
      summary: "$5/$25 定价、1M ctx、128K 输出、thinking 默认开,effort 分五档(xhigh/max 不可关 thinking,属 breaking change),另有 2× 价格 Fast mode。Frontier-Bench v0.1 全场第一(较 Opus 4.8 翻倍)、CursorBench 距 Fable 5 峰值 0.5% 内(半价)、OSWorld 2.0 超 Fable 5(1/3 成本);自动行为审计称\"迄今最对齐模型\";新增 beta mid-conversation tool changes。",
      why: "前沿智能价格再砍半 + 对齐度首次成为发布主打卖点,effort 分档与工具热切换直接影响 agent 部署形态。" },
    { topic: "OPD", title: "Apple: Unmasking On-Policy Distillation——token 级\"理想梯度\"诊断 OPD 何时帮何时伤", url: "https://machinelearning.apple.com/research/unmasking-on-policy-distillation", type: "paper", date: "2026-05 (7月博客化)", stars: 4,
      summary: "[课题相关] 推导\"理想 per-node 梯度\",用 targeted-rollout 算法在长推理链上估计,以 gradient alignment score 量化各蒸馏配置有效性。核心发现:蒸馏信号在错误 rollout 上与理想梯度的对齐显著高于正确 rollout(student 已做对时 teacher 信号近乎噪声);最优配置随 student 容量与任务而变,无普适配置。",
      why: "与本课题同问题但走梯度对齐诊断路线,与 tNLL 指标同族异构——related work 必引;博客未见受控 gap sweep,差异化暂仍成立。" },
    { topic: "OPD", title: "Kimi K3 权重 7/27 释出倒计时:2.8T MoE 细节公开,\"15 天证据缺口\"成反方核心论据", url: "https://memeburn.com/kimi-k3-distillation-2026-faces-a-15-day-evidence-gap/", type: "discussion", date: "2026-07-25", stars: 3,
      summary: "权重定 7/27 00:00 UTC 上 HF:2.8T 稀疏 MoE(激活 ~50B)、KDA 解码 6.3×、896 专家;Arena.ai coding Elo 1679 第一但 TTFT 161s,幻觉率代际上升 39%→51%。取证争议聚焦\"15 天缺口\":两周完成蒸馏→训练→部署被认为\"技术上很难\";正方证据是 340 万次关联 Claude 交互;关键区分——\"检测到蒸馏活动\"≠\"整个模型由蒸馏训成\"。",
      why: "7/27 权重落地后 cross-entropy 指纹等取证方法首次可被任何人独立复核。" },
    { topic: "AI Safety", title: "Moonshots 播客论 K3 释出:\"覆水难收\"与安全护栏的攻防不对称", url: "https://finance.biggo.com/news/409ddd2100883bc9", type: "discussion", date: "2026-07-25", stars: 2,
      summary: "2.8T 开源权重放出即不可撤回(\"智能变成软件后地理围栏近乎不可执行\"),白宫制裁姿态被读作释出前谈判筹码;尖锐案例:HF 入侵取证中美国商用模型因护栏拒绝分析攻击载荷,而 GLM 5.2 完成了——过度限制反而让防守方吃亏。",
      why: "\"开源不可逆 + 护栏攻防不对称\"两条线在 K3 释出前夜合流,open-weight 安全政策讨论的代表性样本。" },
    { topic: "Self-Evolving", title: "Sakana AI: Recursive Harness Self-Improvement——把 harness 当 prompt 级规范迭代自改进", url: "https://arxiv.org/abs/2607.15524", type: "paper", date: "2026-07-17", stars: 3,
      summary: "RHI 把 agent 脚手架视为 prompt 级规范,用修订历史的比较反馈迭代精化任务特定 harness,不动模型权重;30 个合成 ML 研究任务上低 reasoning-effort agent + 少量迭代超 max-effort 基线,推理成本最多省 60%,并给出信息论形式化。",
      why: "Sakana RSI Lab 首批产出,恰落在 harness 进化有效性之争火线上,\"低 effort+RHI 胜 max effort\"需等预算基线检验。" },
    { topic: "Self-Evolving", title: "PRO-LONG: 程序化记忆让 coding agent 在 ARC-AGI-3 长程任务上 +18pp", url: "https://arxiv.org/abs/2607.20064", type: "paper", date: "2026-07-22", stars: 3,
      summary: "Duke:不做有损压缩/检索,维护完整结构化交互日志,让 coding agent 用代码查询自己的历史。ARC-AGI-3 公开游戏集平均 +18pp、最高 76.1% pass@1,token 省 4.2-5.8×;Fable 5 达 97.4% best@2。代码开源。",
      why: "\"全量记录+程序化检索\"与 AttriMem 的\"学习该记什么\"构成记忆问题两极解法,长程 agent 上下文管理正成主战场。" },
    { topic: "Agentic RL", title: "AttriMem: 归因引导的过程反馈破解 agent 记忆学习的 credit assignment 瓶颈", url: "https://arxiv.org/abs/2607.21106", type: "paper", date: "2026-07-23", stars: 3,
      summary: "记忆构建两难:启发式主观、RL 受粗粒度 outcome reward 之苦。AttriMem 用 token 级归因(记忆内容对最终答案的贡献)把 outcome reward 增补为局部 reward;长程对话 QA 超检索式/启发式/RL 基线,跨基准与答案模型泛化,改善 RL 稳定性。",
      why: "把 attribution 当 process reward 用在记忆学习上,记忆管理\"从启发式走向被显式优化\"再添一例。" },
    { topic: "Post-training", title: "(溯源确认) Thinking Machines Inkling:多模态推理开源权重,主打 Tinker 微调", url: "https://thinkingmachines.ai/news/introducing-inkling/", type: "release", date: "2026-07-16", stars: 3,
      summary: "首个开源权重模型确认属实:text/image/audio 高效推理,全量权重开放、当日可在 Tinker 上微调,Artificial Analysis 评其为\"美国最强开源权重模型\";定位可定制底座而非对标最大旗舰。",
      why: "美国阵营首次把\"开源权重+微调平台\"作为主产品路线,post-training 研究可用底座又添一个。" },
    { topic: "Post-training", title: "Beyond Entropy: Correctness-Aware Advantage Shaping via Contrastive Policy Optimization", url: "https://arxiv.org/abs/2607.14614", type: "paper", date: "2026-07", stars: 2,
      summary: "用对比信号(而非纯熵/纯 outcome)重塑 policy optimization 的优势估计。(abs 页限流,本轮仅得标题与列表信息,细节下轮补。)",
      why: "advantage shaping 是 GRPO 系稳定性问题的活跃修补点,与 predictive divergence mask 同属\"判据精细化\"趋势。" },
    { topic: "Agentic RL", title: "Cura 1T: 医疗领域的 agentic 特化大模型", url: "https://huggingface.co/papers/2607.15314", type: "paper", date: "2026-07", stars: 2,
      summary: "面向医疗场景的 1T 级 agentic 特化模型,领域适配的 agent 系统设计;HF 本周 34 赞热度较高。(细节待补。)",
      why: "领域特化 agentic 模型(而非通用模型+提示)开始成体系出现,后训练配方值得跟进。" }
  ]
};
// ===== 数据块结束 =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  REPORT.date + " 晚间研究汇总 · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "总发现数" },
  { v: papers, k: "论文" },
  { v: REPORT.findings.length - papers, k: "博客 / 讨论" },
  { v: REPORT.runs.length, k: "夜间研究轮次" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "全部";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="全部"?"active":""}" onclick="setTopic('全部')">全部</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "全部" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="重要度 ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>为什么值得关注:</b>${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · 每晚 2:00 实验夜班 · 每天 7:00 论文扫描 · 9:00 汇总更新本面板 (美中时间) · 完整日报存档在 autoResearch_AI 项目的 claude/daily/ 下";
</script>
</body>
</html>
