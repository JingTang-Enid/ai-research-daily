<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research 日报 Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav style="display:flex;gap:16px;align-items:center;margin-bottom:18px;font-size:13px;">
  <span style="font-weight:700;">autoResearch_AI</span>
  <a href="../" style="color:var(--muted);text-decoration:none;">今日日报</a>
  <a href="../nightly/" style="color:var(--muted);text-decoration:none;">夜间研究</a>
  <a href="./" style="color:var(--ink);text-decoration:none;font-weight:600;">历史存档</a>
</nav>
<header>
  <h1>AI Research 日报</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — 今天最值得看</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>各主题发现数</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== 每日由早报 agent 替换以下数据块 =====
const REPORT = {
  date: "2026-07-21",
  note: "初始种子扫描(手动 Run 0)· 今晚起将由 03:00 / 05:00 / 07:00 三轮自动研究填充",
  runs: ["Run 0 (手动种子)"],
  tldr: [
    "THUNLP 的《Rethinking On-Policy Distillation》系统解析了 OPD 的现象与机制并给出可复现 recipe,是 OPD 方向目前最系统的工作(附代码)。",
    "《Rethinking Agentic RL in LLMs》对 agentic RL 的多轮工具使用、长程 credit assignment 与 reward 设计做了批判性梳理。",
    "6 月新作 Self-evolving LLM agents with in-distribution Optimization 提出让 agent 在部署分布上持续自我改进。",
    "Post-training 技术栈盘点:GRPO / DAPO / RLVR 已成为 2026 年主流路线,SFT vs RL 的实证对比仍是路线选择核心问题。"
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" }
  ],
  findings: [
    { topic: "Post-training", title: "Post-Training in 2026: GRPO, DAPO, RLVR & Beyond", url: "https://llm-stats.com/blog/research/post-training-techniques-2026", type: "blog", date: "2026", stars: 3,
      summary: "综述当前 post-training 技术栈的演进:从 RLHF/DPO 到 GRPO、DAPO、RLVR(可验证奖励强化学习),讨论各方法的适用场景与工程取舍。",
      why: "对 2026 年 post-training 方法版图的系统梳理,适合作为跟踪基线。" },
    { topic: "Post-training", title: "SFT versus RL: A Study of Post-Training Methods for LLMs", url: "https://arxiv.org/html/2603.13985v1", type: "paper", date: "2026-03", stars: 3,
      summary: "系统对比 SFT 与 RL 两类后训练方法在泛化、遗忘和推理能力上的差异。",
      why: "SFT vs RL 的实证对比是当前 post-training 路线选择的核心问题。" },
    { topic: "OPD", title: "Rethinking On-Policy Distillation: Phenomenology, Mechanism, and Recipe (THUNLP)", url: "https://arxiv.org/abs/2604.13016", type: "paper", date: "2026-04", stars: 4,
      summary: "对 OPD 的现象与机制做系统分析并给出 recipe;解释 OPD 为何比 off-policy 蒸馏和纯 RL 更高效。代码开源 (github.com/thunlp/OPD)。",
      why: "OPD 方向目前最系统的机制性研究之一,带开源代码。" },
    { topic: "OPD", title: "A Survey of On-Policy Distillation for Large Language Models", url: "https://arxiv.org/html/2604.00626v3", type: "paper", date: "2026-04", stars: 3,
      summary: "OPD 综述:方法分类、与 RL/RLHF 的关系、开放问题。另见社区 awesome-on-policy-distillation 列表。",
      why: "快速建立 OPD 领域全景的入口文献。" },
    { topic: "AI Safety", title: "ICLR 2026 Oral Papers in AI Safety: 35 篇深读", url: "https://medium.com/@multimodal_bench/iclr-2026-oral-papers-in-ai-safety-a-35-paper-deep-dive-b5f8a250a0d1", type: "discussion", date: "2026-05", stars: 3,
      summary: "对 ICLR 2026 AI safety 方向 35 篇 oral 论文的归纳:interpretability、评估、对齐鲁棒性等子方向趋势。",
      why: "一次性覆盖顶会 safety 方向的高质量论文清单。" },
    { topic: "Agentic RL", title: "Rethinking Agentic Reinforcement Learning in LLMs", url: "https://arxiv.org/html/2604.27859v2", type: "paper", date: "2026-04", stars: 4,
      summary: "对 agentic RL 训练范式做批判性梳理:多轮工具使用、长程 credit assignment 与 reward 设计。",
      why: "agentic RL 方向近期代表性综述/立场文章。" },
    { topic: "Agentic RL", title: "AgentGym-RL: 多轮 RL 训练长程决策 agent", url: "https://github.com/woooodyy/AgentGym-RL", type: "paper", date: "2025-09", stars: 3,
      summary: "面向长程决策的 LLM agent 多轮 RL 训练框架,提供环境与训练实现。",
      why: "可复现的 agentic RL 训练基础设施。" },
    { topic: "Self-Evolving", title: "Self-evolving LLM agents with in-distribution Optimization", url: "https://www.emergentmind.com/papers/2606.07367", type: "paper", date: "2026-06", stars: 4,
      summary: "提出在分布内优化的自进化 agent 方法,让 agent 在部署分布上持续自我改进。",
      why: "6 月新作,直接命中 self-evolving 方向。" },
    { topic: "Self-Evolving", title: "EvolveR: Experience-Driven Lifecycle 的自进化 agent", url: "https://arxiv.org/abs/2510.16079", type: "paper", date: "2025-10", stars: 3,
      summary: "通过经验驱动的生命周期(积累-蒸馏-复用)让 agent 自我进化;另见 ICLR 2026 RSI workshop 论文列表。",
      why: "经验复用是 self-evolving 的关键机制之一。" }
  ]
};
// ===== 数据块结束 =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  REPORT.date + " 晚间研究汇总 · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "总发现数" },
  { v: papers, k: "论文" },
  { v: REPORT.findings.length - papers, k: "博客 / 讨论" },
  { v: REPORT.runs.length, k: "夜间研究轮次" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "全部";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="全部"?"active":""}" onclick="setTopic('全部')">全部</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "全部" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="重要度 ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>为什么值得关注:</b>${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · 每晚 03:00 / 05:00 / 07:00 (美中时间) 自动研究,每天 9:00 汇总更新本面板 · 完整日报存档在 autoResearch_AI 项目的 claude/daily/ 下";
</script>
</body>
</html>
