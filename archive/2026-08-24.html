<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="../" class="active">Daily Report</a>
  <a href="../nightly/">Paper Scan</a>
</nav>
<header>
  <h1>AI Research Daily</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — Top picks today</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>Findings by topic</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== Replaced daily by the morning-report agent. ALL content in English. =====
const REPORT = {
  date: "2026-08-24",
  note: "Direct morning scan of HF Daily Papers 08-19→08-24 (the 07:00 auto paper-scan did not run for 08-23); 14 items across 7 topics. Environments and harnesses harden into first-class trainable objects (EnvHarness, SPADE, Zetta), and the OPD literature converges on 'go beyond token-level teacher likelihood.' Site push blockade continues (day 21).",
  runs: ["Morning report direct scan (14 items; 07:00 auto paper-scan did not run)"],
  tldr: [
    "★4 EnvHarness (Google Research, 307 HF upvotes) turns the training environment into a co-evolving object: a programmable plug-in layer wraps a static environment without touching its logic or verifier, and EnvRigger treats the policy as a black box, watches its trajectories for weaknesses, and synthesizes targeted environment modifications validated by fresh rollouts. Up to +9.0 points on held-out instances with 9.8% fewer execution steps across five benchmarks in four domains; code released. The direct sequel to last week's 'harness becomes a first-class object' thread — now the environment is the variable, not the model or the scaffold.",
    "★4 τ0-VLA (Shanghai Innovation Institute, 534 HF upvotes) gives a robot foundation model world-model-guided test-time search: a two-tier model trained on 40,115 hours of heterogeneous real robot data compares possible futures before acting — test-time computation lifts prediction accuracy 15–24 points, and hierarchical planning raises closed-loop success from 27.5% to 45.0% on long-horizon tasks of 13–25 ordered steps. Open weights and code. The 'world model → policy' convergence, this time from the VLA side.",
    "★4 [project-related] 'Beyond teacher likelihood' is now a cluster: three OPD papers this window independently argue that token-level teacher agreement rewards locally coherent but globally wrong students, and each replaces it with a trajectory- or group-level signal — GC-OPD group-calibrates verifier + trajectory scores within each rollout group (Qwen3-4B 29.08→40.47), TIDE targets student-excess/deficit mismatch tokens (Avg@8 6.9→20.3 under high mismatch), and Look Ahead validates teacher guidance by future-trajectory rollout. All operate on the guidance-quality axis; none sweeps teacher–student capacity gap, so no collision with the lab draft.",
    "★4 Training Leaves Traces (Amazon): data-free white-box lineage verification from weights alone — a centered residual signature separates fine-tuned, LoRA-merged, pruned, and quantized descendants from independent and distilled models at AUROC 1.0, 76× faster than the nearest robust baseline, robust to function-preserving manipulation. Directly relevant to the K3 distillation-forensics watch — but it verifies shared weights and classifies distilled models as unrelated, so it confirms provenance for checkpoints, not distillation between independent ones.",
    "★3 Self-evolution goes closed-loop and label-free: Zetta ζ evolves runtime critics and recovery skills online while the base policy stays frozen (LIBERO-Pro 90.8%, RoboCasa 93.6%); Co-RL grows reasoning from a diverse multi-agent cohort with no ground-truth labels (+3.0–8.6% across seven LLM benchmarks); SPADE has one model author its own executable environments at its own regret frontier (+5.3 avg over eight benchmarks)."
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" },
    { name: "Multimodal/VLM", color: "--s6" },
    { name: "MoE", color: "--s7" }
  ],
  findings: [
    { topic: "Agentic RL", title: "EnvHarness: awakening static worlds for agent learning", url: "https://arxiv.org/abs/2608.19880", type: "paper", date: "2026-08-20", stars: 4,
      summary: "A programmable layer of plug-in components wraps a static environment without altering its underlying logic or its verification, so the same static world can be reshaped across domains. EnvRigger automates it — treating the policy as a black box, observing execution trajectories to find weaknesses, and synthesizing targeted environment modifications validated by fresh rollouts. Across five benchmarks in four domains, up to +9.0 points on held-out instances with 9.8% fewer execution steps versus original environments and specialized generation pipelines; code released (Google Research, 307 HF upvotes).",
      why: "The environment joins the model and the scaffold as a trainable object — the third face of the 'harness/environment as the variable' thesis in two weeks." },
    { topic: "Multimodal/VLM", title: "τ0-VLA: hierarchical robot foundation model with world-model-guided test-time computation", url: "https://arxiv.org/abs/2608.16885", type: "paper", date: "2026-08-19", stars: 4,
      summary: "A two-tier design — a high-level policy proposing subtasks with execution memory and optional search over alternative futures, a generalist low-level policy executing across embodiments — trained on 40,115 hours of heterogeneous real-world robot data. Test-time computation improves prediction accuracy 15–24 points; hierarchical planning lifts closed-loop success 27.5%→45.0% on 13–25-step tasks lasting up to 12 minutes. Code and checkpoint released (Shanghai Innovation Institute, 534 HF upvotes).",
      why: "Brings deliberate test-time search — 'compare possible futures before deciding' — into an open robot foundation model, the VLA side of the world-model→policy convergence." },
    { topic: "OPD", title: "GC-OPD: group-calibrated on-policy distillation for long-context reasoning", url: "https://arxiv.org/abs/2608.19181", type: "paper", date: "2026-08-19", stars: 3,
      summary: "[project-related] Token-level teacher guidance can reward locally coherent but globally incorrect responses that miss distributed evidence or violate task constraints; GC-OPD normalizes verifier rewards and trajectory-level OPD scores within each rollout group and uses relative-advantage credit assignment to spread the disagreement signal across tokens. Qwen3-4B 29.08→40.47 and Qwen3-8B 35.12→44.65 on a five-benchmark average, above vanilla-OPD baselines (39.31 / 43.56); code released.",
      why: "Another 'modulate the teacher signal by trajectory/group state, don't apply it raw' result — the same family as the lab draft's α-anchoring, but on the guidance-quality axis rather than a capacity-gap sweep; no collision." },
    { topic: "OPD", title: "Mismatch Matters / TIDE: on-policy distillation beyond token agreement", url: "https://arxiv.org/abs/2608.09836", type: "paper", date: "2026-08-13", stars: 3,
      summary: "[project-related] Diagnoses 'degenerate agreement,' where a student mimics repetitive patterns to score high token-level accuracy while staying globally wrong, and instead targets teacher–student mismatch tokens: student-excess tokens (student-generated, teacher-rejected → unstable updates) get bounded-Hellinger shaping, and student-deficit tokens (teacher-preferred, student-rarely-sampled → blocked transfer) get analytic top-K injection without needing to sample them. Under high mismatch, Avg@8 rises 6.9→20.3 with 3.6× shorter responses and far fewer format failures; code released.",
      why: "A second independent argument this window that token-agreement is the wrong OPD objective — the mismatch framing is a clean mechanistic companion to GC-OPD's group calibration." },
    { topic: "AI Safety", title: "Training Leaves Traces: centered residual signatures for language-model lineage verification", url: "https://arxiv.org/abs/2608.14929", type: "paper", date: "2026-08-20", stars: 4,
      summary: "Data-free white-box provenance from weights alone: remove the shared identity-aligned component created during residual training, then compare checkpoint-specific residual-block structure to score lineage. AUROC 1.0 on residual-MLP and GPT-2 benchmarks, 76× faster than the nearest robust baseline, separating fine-tuned/LoRA-merged/pruned/quantized descendants from independent and distilled models; identified 3 related and 7 unrelated public LLaMA-2 checkpoints, robust to function-preserving manipulation across six model families (Amazon).",
      why: "A concrete passive provenance signal for open-weight checkpoints — but it flags distilled models as unrelated, so it settles 'is this a weight descendant of X' rather than the K3-style 'was this distilled from X' question the forensics watch actually needs." },
    { topic: "Self-Evolving", title: "Zetta ζ: an efficient closed-loop embodied harness for self-evolving physical intelligence", url: "https://arxiv.org/abs/2608.16590", type: "paper", date: "2026-08-20", stars: 3,
      summary: "Evolves code-based runtime critics and recovery skills online while keeping the base policy frozen, using three timescale-separated loops (action-frequency governance, rollout-level critic/recovery proposals, validation-gated skill updates); Z-Infra decouples agent logic from heterogeneous execution. LIBERO-Pro 90.8%, RoboCasa 93.6%, 11.1× inference speedup, with skills transferring zero-shot (142 HF upvotes).",
      why: "Self-evolution without touching base weights — the validation-gated skill update is exactly the 'notice when experience expires' discipline PACE-Bench (08-19) argued the memory thread was missing." },
    { topic: "Self-Evolving", title: "Co-RL: unsupervised reasoning emerges from a diverse cohort in multi-agent RL", url: "https://arxiv.org/abs/2608.17253", type: "paper", date: "2026-08-19", stars: 3,
      summary: "Trains multiple independent models simultaneously, each providing reward signals to its peers with no ground-truth labels; increasing cohort diversity — across model families, sizes, and rephrased samples — is what prevents the degenerate feedback loops that collapse self-generated-reward training. +3.0–8.6% across seven LLM benchmarks and +2.3–7.2% across four VLM benchmarks; code released (UC San Diego, 92 HF upvotes).",
      why: "A label-free route to reasoning gains where the anti-collapse mechanism is cohort diversity rather than an external verifier — a different answer to the same problem RLVR self-play attacks." },
    { topic: "Agentic RL", title: "SPADE: self-play in adaptive synthetic executable environments", url: "https://arxiv.org/abs/2608.19197", type: "paper", date: "2026-08-20", stars: 3,
      summary: "One LLM writes its own executable, Gym-style agentic training environments and learns to solve them, grounded on documents from a pretraining corpus, with hint-based regret keeping each environment at the agent's frontier and an environment memory accumulating over time. On 30B models: +5.3 avg over eight math/science/code/reasoning benchmarks, +5.7 on BFCL-v4 multi-turn tool use, +13.9 on ACEBench-Agent, with margins widening at larger scale.",
      why: "Makes environment design a learnable component rather than a hand-curated pool — the self-improvement loop pointed at its own curriculum." },
    { topic: "Post-training", title: "Inject, Align, Recover (IAR): staged post-training for retrieval-free document knowledge internalization", url: "https://arxiv.org/abs/2608.20281", type: "paper", date: "2026-08-20", stars: 3,
      summary: "Treats knowledge exposure, QA accessibility, and capability recovery as three separate objectives: Inject turns documents into continuation/rewrite/instruction-conditioned reconstruction tasks, Align adapts on answer-only QA supervision, and Recover merges the domain-adapted model back with the original instruct model to preserve general ability. Beats vanilla SFT on all four metrics in 7 of 8 dataset-model settings — +3.6pp domain QA, +12.1pp mean general performance — across Llama/Phi/Qwen/SmolLM (BAAI).",
      why: "A clean decomposition of why one-shot domain SFT trades away general capability, with model-merging as the recovery lever." },
    { topic: "Post-training", title: "Thinking in a Low-Resource Language: what SFT builds, what RL fixes, what accuracy cannot see", url: "https://arxiv.org/abs/2608.17744", type: "paper", date: "2026-08-21", stars: 3,
      summary: "Fine-tuning an MoE model to reason in Greek: SFT moves reasoning into the target language (0/1000 traces → ~98%) and improves grammaticality, but introduces format-skipping (~25%), reasoning-into-output leakage, and inconsistent language-instruction adherence; pre-registered RLVR then resolves formatting (24%→2.5%) and eliminates leakage. The sharp finding: changing only the random seed moves the score 7.7 points — more than any data effect measured — so accuracy alone is too noisy, and the paper proposes six length-controlled behavioral dimensions instead. Five checkpoints released.",
      why: "A concrete 'accuracy hides the real changes' case for the post-training-eval thread, with a seed-variance number that reframes small benchmark deltas as noise." },
    { topic: "MoE", title: "Cacheable by Design? Training MoE routers for locality against the edge memory-bandwidth wall", url: "https://arxiv.org/abs/2608.18261", type: "paper", date: "2026-08-18", stars: 2,
      summary: "Serving large MoE on consumer GPUs is memory-bandwidth- not compute-bound (Qwen3-235B measured at 0.44 tok/s warm, most experts on SSD). Training routers for expert cacheability cuts misses up to 60% with a 99% static-pin hit rate, but every configuration that hit the locality target exceeded acceptable quality thresholds; a hybrid of training-free cache-aware rerouting plus trained locality reaches ~80% miss reduction at acceptable quality, beating either alone. Pre-registered negative result; code, traces, and pre-registration released.",
      why: "A rigorously pre-registered 'this doesn't work as hoped' on router-level cacheability — the honest counterweight to the wave of MoE-serving optimism, and it names the hybrid that actually clears the bar." },
    { topic: "MoE", title: "The Evolution of Mixture-of-Experts Architectures in LLMs", url: "https://arxiv.org/abs/2608.08650", type: "paper", date: "2026-08-09", stars: 2,
      summary: "Organizes MoE development not chronologically but along five coupled dimensions — expert granularity, expert topology, routing freedom, load-balancing scope, execution structure — and maps eight milestones as a dependency graph across four control planes (topology / routing / balance / expert parallelism). Central thesis: the field is shifting from 'activate more sparse parameters' toward decoupling semantic routing, compute budgets, and physical execution.",
      why: "A structural map for a topic where the batch keeps yielding point solutions (TAOT placement, UniF-MoE shared-block extraction, this window's cacheability result) rather than a shared frame." },
    { topic: "Multimodal/VLM", title: "4DAnyone: create anyone in 4D from a casual monocular video", url: "https://arxiv.org/abs/2608.20335", type: "paper", date: "2026-08-21", stars: 2,
      summary: "Reconstructs an animatable 4D human from a single casual monocular video; the highest-voted paper of the window at 586 HF upvotes.",
      why: "Monocular-to-4D human capture is maturing fast on the generative track — adjacent to the unified generative-backbone line the report has been tracking, though narrower in scope." },
    { topic: "AI Safety", title: "Bounded Agents: delegation security for multi-agent AI systems", url: "https://arxiv.org/abs/2608.15888", type: "paper", date: "2026-08-20", stars: 2,
      summary: "Frames security for multi-agent systems around bounding what authority one agent can delegate to another, so a compromised or misaligned sub-agent cannot exceed the caller's intended scope. List-level this round (4 HF upvotes).",
      why: "As agent-of-agents deployments spread, delegation-scope enforcement is the multi-agent analogue of least-privilege — a safety primitive the harness-training thread will eventually need." }
  ]
};
// ===== End of data block =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  "Overnight summary · " + REPORT.date + " · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "total findings" },
  { v: papers, k: "papers" },
  { v: REPORT.findings.length - papers, k: "blogs / discussions" },
  { v: REPORT.runs.length, k: "overnight runs" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "All";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="All"?"active":""}" onclick="setTopic('All')">All</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "All" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="importance ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>Why it matters:</b> ${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · paper scan 7:00 AM · daily report 9:00 AM (US Central) · full archives in the autoResearch_AI project (claude/daily/)";
</script>
</body>
</html>
