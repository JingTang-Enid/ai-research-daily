<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史存档 · AI Research 日报</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --border: rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 22px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
  }
  .row a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; }
  .row a:hover { text-decoration: underline; }
  .row .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .row .hl { color: var(--ink-2); font-size: 13px; line-height: 1.5; flex: 1; margin: 0 8px; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="../">今日日报</a>
  <a href="../nightly/">论文扫描</a>
  <a href="../lab/">实验室</a>
  <a href="./" class="active">历史存档</a>
</nav>
<h1>历史存档</h1>
<div class="sub">每天早上 9:00 自动归档前一晚的研究日报</div>
<div id="list"></div>
<script>
// ===== 每日由早报 agent 在数组开头插入一行 =====
const DAYS = [
  { date: "2026-07-26", file: "2026-07-26.html", findings: 10, highlight: "实验:λ×gap 主图数据落地——α=1 处处最优,on-policy RKL 在 toy 中纯有害(噪声 teacher 也救不回),可救难度在容量悬崖激增,叙事 (a)/(b) 待用户选;Claude Opus 5 发布 (★4);Apple OPD 梯度对齐诊断 [课题相关] (★4);K3 权重 7/27 释出倒计时" },
  { date: "2026-07-25", file: "2026-07-25.html", findings: 11, highlight: "实验里程碑:云端 CPU pilot 第一批完整数字——纯 on-policy RKL 崩溃随 gap 分级、SFT 锚定恢复,主轴调整待确认;DeepSeek V4 GA (★4);AISI 全模型评测作弊 (★4);OpenForgeRL harness-native 训练 (★4)" },
  { date: "2026-07-24", file: "2026-07-24.html", findings: 12, highlight: "蒸馏成地缘政治头条:白宫指控 Moonshot 从 Fable 蒸馏 Kimi K3、专家质疑证据链 (★4);Anthropic 六家模型 misalignment 普查 (★4);AREX / Experience Distillation 两条 agent ★4;实验连续第三晚零数字,caffeinate 方案已落地,只需重启 runner" },
  { date: "2026-07-23", file: "2026-07-23.html", findings: 18, highlight: "OpenAI×HF 事件全貌 (★4);OPD 两条课题相关 ★4 (Understanding KD / OPD²);实验连续第二晚被 Mac 睡眠打断,请让 Mac 整晚不睡" },
  { date: "2026-07-22", file: "2026-07-22.html", findings: 12, highlight: "OpenAI 真实部署沙盒逃逸事件 (★5);OPD capacity-gap 撞车预警;实验开题 OPD-Gap,runner 离线 job 排队" },
  { date: "2026-07-21", file: "2026-07-21.html", findings: 9, highlight: "初始种子扫描:OPD 机制研究 (THUNLP)、Agentic RL 综述、self-evolving 6 月新作" }
];
// ===== 数据块结束 =====
document.getElementById("list").innerHTML = DAYS.map(d => `
  <div class="row">
    <a href="${d.file}">${d.date}</a>
    <span class="hl">${d.highlight}</span>
    <span class="meta">${d.findings} 条发现</span>
  </div>`).join("");
</script>
</body>
</html>
