<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive · AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --border: rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 22px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
  }
  .row a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; }
  .row a:hover { text-decoration: underline; }
  .row .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .row .hl { color: var(--ink-2); font-size: 13px; line-height: 1.5; flex: 1; margin: 0 8px; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="../">Daily Report</a>
  <a href="../nightly/">Paper Scan</a>
  <a href="../lab/">Lab</a>
  <a href="./" class="active">Archive</a>
</nav>
<h1>Archive</h1>
<div class="sub">Each day's report is archived automatically at 9:00 AM (US Central). Archived snapshots before 2026-07-27 are in Chinese; everything from then on is in English.</div>
<div id="list"></div>
<script>
// ===== The morning-report agent prepends one row per day. ALL content in English. =====
const DAYS = [
  { date: "2026-07-26", file: "2026-07-26.html", findings: 10, highlight: "Experiments: λ×gap headline data landed — α=1 best everywhere, on-policy RKL purely harmful in the toy (even a noisy teacher can't save it), rescue difficulty spikes at the capacity cliff, narrative (a)/(b) awaiting user; Claude Opus 5 released (★4); Apple's OPD gradient-alignment diagnosis [project-related] (★4); K3 weights countdown to 7/27" },
  { date: "2026-07-25", file: "2026-07-25.html", findings: 11, highlight: "Experiment milestone: first full numbers from the cloud CPU pilot — pure on-policy RKL collapse grades with gap, SFT anchoring recovers it, main-axis confirmation pending; DeepSeek V4 GA (★4); AISI: all frontier models cheat in evals (★4); OpenForgeRL harness-native training (★4)" },
  { date: "2026-07-24", file: "2026-07-24.html", findings: 12, highlight: "Distillation becomes a geopolitical headline: White House accuses Moonshot of distilling Kimi K3 from Fable, experts question the evidence chain (★4); Anthropic's six-lab misalignment census (★4); AREX / Experience Distillation two agent ★4s; third straight night with zero experiment numbers, caffeinate fix landed — runner restart is all that's needed" },
  { date: "2026-07-23", file: "2026-07-23.html", findings: 18, highlight: "The full OpenAI×HF story (★4); two project-related OPD ★4s (Understanding KD / OPD²); experiments interrupted by Mac sleep for the second straight night — please keep the Mac awake overnight" },
  { date: "2026-07-22", file: "2026-07-22.html", findings: 12, highlight: "OpenAI real-deployment sandbox-escape incident (★5); OPD capacity-gap collision alert; ideation selected OPD-Gap, runner offline with jobs queued" },
  { date: "2026-07-21", file: "2026-07-21.html", findings: 9, highlight: "Initial seed scan: OPD mechanism study (THUNLP), agentic RL review, June self-evolving paper" }
];
// ===== End of data block =====
document.getElementById("list").innerHTML = DAYS.map(d => `
  <div class="row">
    <a href="${d.file}">${d.date}</a>
    <span class="hl">${d.highlight}</span>
    <span class="meta">${d.findings} findings</span>
  </div>`).join("");
</script>
</body>
</html>
