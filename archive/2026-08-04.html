<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="../" class="active">Daily Report</a>
  <a href="../nightly/">Paper Scan</a>
</nav>
<header>
  <h1>AI Research Daily</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — Top picks today</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>Findings by topic</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== Replaced daily by the morning-report agent. ALL content in English. =====
const REPORT = {
  date: "2026-08-04",
  note: "Paper scan: 14 items across 7 topics (Monday arXiv batch fully visible via HF Daily Papers; Qwen3.8-Max and a three-paper RLVR+OPD fusion cluster headline)",
  runs: ["Paper scan 07:00 (14 items)"],
  tldr: [
    "★4 [MoE] Qwen3.8-Max — Alibaba's largest model to date: a 2.4T-parameter sparse MoE with text/image/video input and 1M-token context, claiming frontier-tier agentic results (Terminal-Bench 2.1 86.6, OSWorld-Verified 86.1, FrontierSWE 73.5 — all vendor numbers, unverified). API live at $2/$6 per 1M tokens; open weights plus a 27B sibling promised \"next week\" — if they ship, the open MoE cohort gains its first natively multimodal trillion-scale member.",
    "★4 [AI Safety] Constitutional Midtraining (Oxford): inserting a 394M-token constitutional corpus at midtraining (120B-token scale, controlled 2×2 design) produces alignment gains that survive SFT and benign fine-tuning (blackmail propensity −17.5pp vs control) with no capability cost — the first controlled evidence that alignment can be moved upstream of post-training and persist downstream.",
    "★4 [Self-Evolving] RLSVR / SpyRL generalizes RLVR to open-ended tasks by transforming them into self-verifiable proxy games: a multi-agent \"Who Is the Spy?\" self-play setup makes voting outcomes (ground-truth spy identity) a verifiable reward that correlates with output quality. #1 HF paper of the day; code and models released.",
    "★3 [project-related] [OPD] The RLVR+OPD fusion line is suddenly crowded — three papers this round blend dense teacher signal with outcome reward: SAF-OPD (stable advantage fusion via sparsification/compression/annealing), Distilled RL (teacher supervision inside the RL objective via reverse importance sampling), and Distill Where You Fail (adaptive teacher guidance on all-negative GRPO groups). The field keeps converging on \"gate teacher supervision by student state.\"",
    "★3 [Post-training] DeepSeek V4-Flash 0731: a pure re-post-training refresh (no architecture change) that jumps Terminal-Bench 2.1 61.8→82.7 and DeepSWE 7.3→54.4 at unchanged $0.14/$0.28 pricing — the cleanest public demonstration yet that agentic capability at fixed architecture is a post-training variable."
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" },
    { name: "Multimodal/VLM", color: "--s6" },
    { name: "MoE", color: "--s7" }
  ],
  findings: [
    { topic: "MoE", title: "Qwen3.8-Max: Alibaba's largest model — 2.4T sparse MoE, multimodal input, 1M context, open weights promised", url: "https://www.marktechpost.com/2026/08/03/alibaba-qwen-releases-qwen3-8-max/", type: "release", date: "2026-08-03", stars: 4,
      summary: "A 2.4-trillion-parameter sparse MoE (active-parameter count undisclosed) taking text/image/video input, with 1M-token context and 131K output. Vendor benchmarks claim frontier-tier agentic performance — Terminal-Bench 2.1 86.6, GPQA Diamond 92.6, OSWorld-Verified 86.1, FrontierSWE 40.7→73.5 over its predecessor — with press framing it against GPT-5.6 Sol Max and Claude Fable 5; cautious outlets note all numbers are internal. API live at $2/$6 per 1M tokens; open weights plus a smaller Qwen3.8-27B promised \"next week.\"",
      why: "A third trillion-scale open(-bound) MoE joining K3/V4-Pro/GLM-5.2 — if the weights ship, the open MoE cohort gains its first natively multimodal member at this scale." },
    { topic: "AI Safety", title: "Constitutional Midtraining: values content injected before post-training produces durable alignment", url: "https://huggingface.co/papers/2607.26654", type: "paper", date: "2026-07-29", stars: 4,
      summary: "Cho et al. (Oxford) insert a 394M-token constitutional corpus into midtraining at 120B-token scale against a replay-only control, in a 2×2 design varying curriculum ordering and deliberative reasoning. Constitutionally midtrained models show durable alignment gains through SFT and benign fine-tuning — SFT instills blackmail propensity in all models, but midtraining blunts it with the advantage surviving benign fine-tuning (−17.5pp) — with no capability loss. Content presence matters more than curriculum or reasoning structure; gains fade where active resistance to in-context pressure is required.",
      why: "First controlled evidence that alignment can be pushed upstream of post-training and survive downstream fine-tuning — directly relevant to fine-tuning-robust safety." },
    { topic: "Self-Evolving", title: "RLSVR / SpyRL: task transformation turns open-ended generation into self-verifiable rewards", url: "https://huggingface.co/papers/2607.23802", type: "paper", date: "2026-07-26", stars: 4,
      summary: "Wang et al. (Duke/Adobe/Penn State) generalize RLVR to open-ended tasks by transforming them into verifiable proxy environments. The instantiation, SpyRL, is a multi-agent \"Who Is the Spy?\" self-play game: players receive asymmetric information, produce task outputs (summaries, creative writing), and vote to identify the spy — since spy identity is ground truth, voting outcomes are fully verifiable rewards that correlate with output quality. Outperforms existing self-improvement methods on non-verifiable tasks while holding gains on verifiable reasoning; code and models released. #1 HF paper of the day (143 upvotes).",
      why: "A general recipe for manufacturing verifiable rewards where none exist — self-play game design as reward engineering — which directly attacks RLVR's biggest scope limitation." },
    { topic: "Post-training", title: "DeepSeek V4-Flash 0731: a pure re-post-training refresh that transforms agentic performance at unchanged price", url: "https://xenospectrum.com/en/deepseek-v4-flash-0731-pricing/", type: "release", date: "2026-07-31", stars: 3,
      summary: "DeepSeek's 0731 update to V4-Flash (280B total / 13B active MoE, 1M context) changes no architecture — it is explicitly \"re-post-training\" with agent-focused optimization plus three reasoning-effort levels, native Responses API, and MIT-licensed weights. Agentic benchmarks jump dramatically: Terminal-Bench 2.1 61.8→82.7, DeepSWE 7.3→54.4, while remaining below Opus 4.8 on all nine benchmarks tested. Price held at $0.14/$0.28 per 1M tokens.",
      why: "The cleanest public demonstration yet that agentic capability at fixed architecture is a post-training variable — a +47-point DeepSWE swing from post-training alone." },
    { topic: "OPD", title: "SAF-OPD: stable advantage fusion for combining RLVR with on-policy distillation", url: "https://huggingface.co/papers/2607.29209", type: "paper", date: "2026-07-31", stars: 3,
      summary: "[project-related] Ding et al. (Meituan) diagnose why naively adding OPD's dense token-level advantages to RLVR's response-level rewards fails: magnitude mismatch and temporal mismatch. SAF is a four-stage pipeline applied only to the OPD advantages — top-k sparsification, tanh-bounded compression, KL-triggered warm-up, linear annealing — each independently switchable, no auxiliary models. On Qwen3 1.7B/4B/8B across seven benchmarks it gains 0.51–2.70% aggregate and avoids the entropy collapse of fixed-coefficient fusion.",
      why: "Another \"modulate the teacher signal, don't apply it raw\" method — its KL-triggered warm-up is functionally an adaptive anchoring schedule." },
    { topic: "OPD", title: "Distilled RL: teacher supervision inside the RL objective, with reverse importance sampling", url: "https://arxiv.org/abs/2607.17247", type: "paper", date: "2026-07-19", stars: 3,
      summary: "[project-related] Wang et al. integrate teacher supervision into the RL objective rather than alternating or summing the two: reverse importance sampling with clipping reweights teacher signal toward where the student would go, negative sample reset handles failed rollouts, and sequence-level geometric normalization stabilizes the combined objective. Substantially outperforms both standard RL and plain OPD on pass@1 and pass@k, within-family and cross-family; code released.",
      why: "With SAF-OPD and 2608.00782, completes a three-paper cluster this round on how to blend dense teacher signal with outcome reward without one destroying the other." },
    { topic: "OPD", title: "Distill Where You Fail: adaptive teacher guidance recovers signal from all-negative RL groups", url: "https://arxiv.org/abs/2608.00782", type: "paper", date: "2026-08-01", stars: 3,
      summary: "[project-related] Targets GRPO's dead-signal case — groups where every rollout fails and the advantage is uniformly zero — by injecting adaptive teacher guidance to recover learning signal exactly on those failed groups, i.e., distillation applied selectively where RL has nothing to learn from. (Abs page rate-limited this round; details to backfill.)",
      why: "The third selective-guidance entrant this round: the field keeps converging on \"gate teacher supervision by student state.\"" },
    { topic: "OPD", title: "K3 provenance, the case against: Sukhareva's economic and timeline rebuttal of the Fable-distillation claim", url: "https://msukhareva.substack.com/p/is-kimi-k3-really-distilled-from", type: "discussion", date: "2026-07-27", stars: 3,
      summary: "Sukhareva argues the K3-distilled-from-Fable claim is implausible on logistics: Fable 5 launched June 9 and K3 shipped July 16 — 18 days to collect, filter, train, evaluate, and ship a 2.8T model; Fable 5 costs 3.3× more per harvested token than Sonnet 4.6 at a quarter the speed and actively classifies extraction attempts; and GLM-5.2 would have been a cheaper, unrestricted source. Concludes the distillation narrative serves regulatory positioning more than technical truth.",
      why: "Behavioral evidence (Greenblatt/Zvi) and economic implausibility now point in opposite directions — only weight-level forensics (still unpublished) settles it." },
    { topic: "Post-training", title: "CriPO: on-policy self-distillation fixes rubric-based RL's dead criteria", url: "https://huggingface.co/papers/2607.18082", type: "paper", date: "2026-07-21", stars: 3,
      summary: "Xia et al. (Zhejiang) identify two signal-loss failure modes in rubric-based RL: Unexplored Criteria (never sampled, so never optimized) and Suppressed Criteria (satisfied criteria lose signal in reward aggregation — >57% of samples affected). CriPO fixes both with self-teachers: a criterion-injection teacher applies localized forward-KL to inject missing behaviors, and a counterfactual teacher corrects token-level advantages on criterion-relevant tokens. Beats rubric-RL baselines on medicine/science benchmarks with ~2× fewer optimization steps.",
      why: "Rubric rewards are the current answer to non-verifiable domains, and this is the first careful accounting of where their signal silently vanishes." },
    { topic: "AI Safety", title: "A safety trilemma: copyable context cannot ground reliable dual-use safeguards", url: "https://huggingface.co/papers/2607.27951", type: "paper", date: "2026-07-30", stars: 3,
      summary: "Wu et al. (USTC) formalize the dual-use problem game-theoretically: since attackers can copy any observable context a legitimate professional would present, defenses conditioned only on copyable evidence face a trilemma — useful capability, reliable safety, and open access cannot coexist — and the paper derives the exact worst-case floor on attacker assistance when useful answers are preserved. Proposed remedy: hard-to-copy, use-predictive trusted credentials; validated on dual-use evals and adaptive attacks.",
      why: "Gives the \"just add better refusal classifiers\" position a formal impossibility result." },
    { topic: "Agentic RL", title: "CompactionRL: jointly training task execution and context compaction for long-horizon agents", url: "https://arxiv.org/abs/2607.05378", type: "paper", date: "2026-07-06", stars: 3,
      summary: "Li et al. (Tsinghua, GLM line) train agents to summarize and compress their own interaction history mid-task instead of truncating at the context limit, jointly optimizing execution and summary generation via token-level loss normalization and cross-trajectory GAE. GLM-4.5-Air gains +7.0 points on SWE-bench Verified (66.8%) and +3.1 on Terminal-Bench 2.0; the method was deployed in training GLM-5.2 (750B).",
      why: "Context management trained end-to-end with RL rather than bolted on as a heuristic — and confirmed as a production ingredient of a frontier model." },
    { topic: "Multimodal/VLM", title: "N_0-VTLA: scaling vision-tactile-language-action models with latent tactile tokens", url: "https://huggingface.co/papers/2607.23782", type: "paper", date: "2026-07-26", stars: 3,
      summary: "Extends the VLA recipe with touch: tactile signals are compressed into latent tactile tokens and integrated alongside vision and language for action prediction, scaled as a foundation-model training run; the companion N_0-TWAM paper (2607.23783) trains a tactile-native world-action model for contact-rich manipulation.",
      why: "Tactile joins vision/language as a first-class modality in the VLA scaling recipe — embodied multimodality is broadening fast." },
    { topic: "Multimodal/VLM", title: "Mental World Modeling: coupling physical world models with hidden mental states", url: "https://huggingface.co/papers/2607.27201", type: "paper", date: "2026-07-29", stars: 3,
      summary: "Fei & Zhao propose maintaining a coupled physical-mental world state — what agents believe, want, intend, feel — rather than only predicting physical scene evolution. MENTIS, a training-free six-stage instantiation, significantly improves human decision prediction across eight LLM-based models on text/image/video scenarios, with the largest gains in interpersonal contexts; transition simulation is the bottleneck stage.",
      why: "World models for agents acting among humans need theory-of-mind state, and this gives that claim its first systematic multimodal evaluation." },
    { topic: "Post-training", title: "Counterfactual sensitivity credit reallocation for long-CoT reasoning", url: "https://huggingface.co/papers/2607.27888", type: "paper", date: "2026-07-30", stars: 2,
      summary: "Proposes reallocating credit among tokens in long chain-of-thought RL by counterfactual sensitivity — measuring which tokens actually change the outcome — rather than spreading outcome reward uniformly. (Abs page rate-limited this round; details to backfill.)",
      why: "Token-level credit assignment for outcome-reward RL is a structural gap; a sensitivity-based estimator is the natural next instrument." }
  ]
};
// ===== End of data block =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  "Overnight summary · " + REPORT.date + " · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "total findings" },
  { v: papers, k: "papers" },
  { v: REPORT.findings.length - papers, k: "blogs / discussions" },
  { v: REPORT.runs.length, k: "overnight runs" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "All";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="All"?"active":""}" onclick="setTopic('All')">All</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "All" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="importance ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>Why it matters:</b> ${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · paper scan 7:00 AM · daily report 9:00 AM (US Central) · full archives in the autoResearch_AI project (claude/daily/)";
</script>
</body>
</html>
