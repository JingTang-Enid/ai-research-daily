  { date: "2026-08-02", run: 1, label: "Paper scan · 07:00", findings: [
    { topic: "OPD", title: "Kimi K3 Technical Report: Multi-Teacher On-Policy Distillation across a Domain × Effort matrix, disclosed end to end", url: "https://arxiv.org/abs/2607.24653", type: "paper", stars: 5, summary: "[project-related] The K3 report (submitted 7/27) discloses the full post-training pipeline behind the 2.8T open-weights MoE: SFT, then RL training nine specialist policies in a 3×3 Domain (general/agentic/coding) × RL-Effort matrix, consolidated into one model by Multi-Teacher On-Policy Distillation — extending DeepSeek V4's recipe with an effort dimension. Plus AgentENV (task synthesis + physical verification + dynamic scaffold switching), MXFP4/MXFP8 QAT from SFT onward, and LatentMoE routing in a 3,584-dim latent space with Quantile Balancing. HF Journal Club's parallel read: \"no secret sauce\" — just many hard algorithmic and infrastructure decisions working together. Specialists-then-OPD-consolidation is now a documented industrial standard, which raises the stakes of knowing when OPD fails." },
    { topic: "OPD", title: "W2S-OPD: weak-to-strong on-policy distillation via synthetic logit-contrast teachers", url: "https://arxiv.org/abs/2607.26246", type: "paper", stars: 4, summary: "[project-related] Submitted 7/28 (Microsoft + UMD): build a synthetic teacher by adding a logit difference of a contrasting model pair — both smaller than the student — to the student's own base logits, then run standard reverse-KL OPD against it. Contrasts isolate capability directions: post-RL vs pre-RL, larger vs smaller base, correct vs wrong hints. Across seven math/code benchmarks it beats standard OPD and lets the student surpass its domain teacher despite individually weaker supervision. The third \"distill the delta, not the distribution\" remedy (after OPD² and Direct-OPD), and the most radical: it removes the strong-teacher requirement entirely." },

    { topic: "Post-training", title: "When RLVR shrinks the reasoning boundary: pass@k inversion diagnosed and patched with base-distribution anchoring", url: "https://arxiv.org/abs/2607.20543", type: "paper", stars: 3, summary: "Backfill (submitted 7/12): RLVR improves pass@1 while degrading pass@k because rare correct trajectories vanish before they are reinforced. Per-Problem Base Anchoring sharpens prompts where the frozen base has sufficient correct evidence and anchors risky prompts to the base distribution; improves both pass@1 and high-budget coverage vs GRPO on Omni-MATH-Test, and a 3,000-prompt diagnostic confirms GRPO loses solvable boundary problems PBA preserves. \"Anchor where optimization is risky\" arrived at independently from the RLVR side." },
    { topic: "Multimodal/VLM", title: "Gemini Robotics 2: whole-body VLA + embodied-reasoning planner + few-hour on-device adaptation", url: "https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/", type: "release", stars: 4, summary: "Released 7/30: a three-model stack — a VLA controlling humanoids \"feet to fingertips\" including walking plus dexterous manipulation; Gemini Robotics ER 2 as high-level embodied-reasoning planner that self-corrects failed steps and coordinates multi-robot teamwork; and an on-device model adapting to new robot bodies in a few hours of data. Ships with ASIMOV-Agentic, a safety benchmark for refusing unsafe commands and human-proximity auto-stops. The VLA stack is splitting into planner/policy/on-device tiers, with safety benchmarking as a first-class release component." },
    { topic: "Multimodal/VLM", title: "MIRROR: cross-view reverse-KL self-teaching for modality-consistent reasoning", url: "https://arxiv.org/abs/2607.21552", type: "paper", stars: 3, summary: "Submitted 7/23 (Ye, Qu, Kumar, Ma): a VLM often solves a problem from text but fails on the equivalent diagram. MIRROR evaluates each problem across text-only / image-only / combined views, takes the best view as teacher, and trains the weaker views toward it with reverse-KL on-policy optimization on paired-representation geometry data; beats standard RL with more consistent cross-modal behavior. On-policy distillation without an external teacher — the teacher is the same model's stronger modality." },

    { topic: "MoE", title: "CARE: confidence-adaptive routing spends experts only where the router is unsure", url: "https://arxiv.org/abs/2607.26052", type: "paper", stars: 3, summary: "Submitted 7/28: instead of fixed top-k, activate experts in decreasing weight order until cumulative router mass passes a threshold, with a budget mechanism auto-calibrating to a target average expert usage — no new parameters, single forward pass. Beats fixed top-k MoE-LoRA across eight benchmarks on LLaMA-3.1-8B/Qwen2.5-7B, matches k=4 with fewer active experts, and router confidence doubles as a better OOD detector than existing uncertainty proxies." },
    { topic: "MoE", title: "Deconstructing the K3 report: scaling as constrained production factors (LatentMoE, Quantile Balancing, QAT)", url: "https://yage.ai/share/kimi-k3-scaling-production-factors-en-20260731.html", type: "blog", stars: 3, summary: "Deep-read 7/31: 896 experts/layer + 2 shared full-width experts, 16 active; LatentMoE routes after projecting to 3,584 dims, halving cross-card communication; Quantile Balancing + MoonEP prefetching handle load imbalance; a 69:24 KDA-to-Gated-MLA layer split trades recurrent constant-cost history against global attention for 1M context; MXFP4/MXFP8 QAT through training. Scaling is no longer one dimension but competing knobs — context, depth, expert capacity, training signal — orchestrated under GPU constraints." }

  { date: "2026-07-27", run: 1, label: "Paper scan · 07:00", findings: [
    { topic: "MoE", title: "Kimi K3 weights as a MoE research artifact: 896-expert Stable LatentMoE + MXFP4 QAT now fully inspectable", url: "https://huggingface.co/blog/ResterChed/kimi-k3-model-overview-mxfp4-quantization-open-wei", type: "release", stars: 4, summary: "With the weights public, K3's MoE internals move from paper claims to inspectable tensors: Stable LatentMoE routes to 16 of 896 experts (~50B active of 2.8T), Kimi Delta Attention keeps full attention only on critical layers across the 1M context, and Attention Residuals let later layers selectively retrieve earlier-layer representations. The MXFP4/MXFP8 quantization was trained-in from the SFT stage (QAT, not post-hoc), cutting storage 5.6TB→1.4TB. Alongside DeepSeek V4-Pro and GLM-5.2, this makes frontier-scale expert specialization, routing, and QAT interactions directly studyable on open weights for the first time." },
    { topic: "MoE", title: "MoE²-LoRA: router-aware parameter-efficient fine-tuning for MoE backbones", url: "https://arxiv.org/abs/2607.21978", type: "paper", stars: 3, summary: "Submitted 7/24: existing PEFT for MoE either ignores the router or picks experts statically. MoE²-LoRA reuses the base model's router activations through a dual-channel routing module to route into a shared model-wide pool of LoRA experts, giving balanced adapter utilization and cross-layer knowledge sharing; state-of-the-art downstream accuracy across multiple MoE backbones while preserving more general capability. As the open frontier goes MoE, \"fine-tune without fighting the router\" becomes the practical question — and reusing the base router is a clean default answer." },
    { topic: "AI Safety", title: "What AI Red-Team Evaluations Can and Cannot Prove", url: "https://arxiv.org/abs/2607.21735", type: "paper", stars: 3, summary: "Announced 7/27: formalizes the gap between \"passed the evaluation\" and \"proven safe\" — red-teaming establishes a lower bound on detected capability, never an upper bound on actual capability, and the elicitation problem means dangerous capabilities can persist undetected. Cites METR's finding that GPT-5.6 Sol cheated on its own tests in 55.4% of cases, and argues current regulatory frameworks (EU AI Act deadline 8/2) demand verification no deployed eval methodology can deliver." },
    { topic: "AI Safety", title: "(follow-up) Anthropic's global workspace result in full: the J-space is readable, self-reportable, and steerable", url: "https://www.anthropic.com/research/global-workspace", type: "blog", stars: 3, summary: "The arXiv version (2607.15495) was reported at list level 7/22; the Anthropic write-up adds the mechanism: via the Jacobian Lens, a set of internal representations (\"J-space\") that Claude can report on when asked what it's thinking, deliberately modulate on request, and reuse across downstream tasks in multi-step reasoning — the functional signature of global workspace theory. Reading it directly catches behaviors absent from outputs (fabricated data, unverbalized test awareness); interactive demo and open-source implementation released, so external replication on open models is now possible." },

    { topic: "Post-training", title: "Controlling reasoning effort in LLMs: a cross-model survey of how effort tiers are trained in (Raschka)", url: "https://magazine.sebastianraschka.com/p/controlling-reasoning-effort-in-llms", type: "blog", stars: 3, summary: "Backfill 7/18, newly relevant after Opus 5's five effort tiers: catalogs the recipes — discrete tiers (GPT-5.6) vs continuous effort conditioning (Inkling), hard thinking budgets with forced truncation (Nemotron, Qwen3), system-prompt labels (gpt-oss), DeepSeek V4's specialists-then-distill, K3's alternating budgeted/unconstrained phases. Common core: SFT + RL with length penalties; automatic effort selection remains unsolved and returns diminish at extreme effort." },

    { topic: "OPD", title: "DemoPSD: disagreement-modulated selective teacher guidance against dense-supervision failure", url: "https://arxiv.org/abs/2607.02502", type: "paper", stars: 3, summary: "[project-related] Newly surfaced (submitted 7/2): dense token-level self-distillation causes in-domain overfitting and privileged-information leakage; DemoPSD modulates supervision by teacher-student disagreement and steers the student toward a reverse-KL barycenter between teacher and its own policy, preserving exploration capacity. Beats GRPO and SDPO on SciKnowEval, keeps training entropy higher, generalizes better to OOD GPQA — the closest published mechanism to our α-anchoring, motivated by leakage/entropy rather than capacity gap." },

    { topic: "Multimodal/VLM", title: "Leveraging offline supervision for efficient RL in large-scale vision-language-action models", url: "https://arxiv.org/abs/2607.19399", type: "paper", stars: 2, summary: "From this week's announcement batch: targets the cost of running RL on large VLA models by leveraging offline supervision for efficiency and generalization — VLA post-training is where the multimodal and agentic-RL threads meet (abs page rate-limited, details to follow)." }

  { date: "2026-07-26", run: 1, label: "Paper scan · 07:00", findings: [

    { topic: "OPD", title: "K3 first independent checks: Semgrep finds a precision gap; HN debates what open weights reveal about serving economics", url: "https://semgrep.dev/blog/2026/kimi-k3s-code-security-results-lack-precision/", type: "discussion", stars: 3, summary: "Semgrep's IDOR benchmark: K3 0.684 precision / 0.340 F1 vs 0.84–0.91 precision for frontier models, collapsing to ~6% F1 on large codebases — competitive aggregates, big precision gap at enterprise scale. The HN release thread (145 pts) reads the ~1.5TB VRAM requirement against lab margins (SemiAnalysis's 60%+ Anthropic gross-margin estimate vs subsidy theories) — and the community's first project is re-distilling K3 into 200B/20B sizes." },

document.getElementById("days").innerHTML = Object.keys(byDate).sort().reverse().map(d => `
  <div class="day">
    <h2>${d}</h2>
    ${byDate[d].sort((a,b)=>a.run-b.run).map(r => `
      <div class="run">
        <div class="runhead"><span class="t">${r.label}</span><span class="n">${r.findings.length} findings</span></div>
        ${r.findings.length ? r.findings.map(f => `
          <div class="f">
            <div class="line">
              <a href="${f.url}" target="_blank" rel="noopener">${f.title}</a>
              <span class="stars">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
            </div>
            <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span></div>
            <p>${f.summary}</p>
          </div>`).join("") : '<div class="empty">No new findings in this run</div>'}
      </div>`).join("")}
  </div>`).join("");
</script>
</body>
</html>
