<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="./" class="active">Daily Report</a>
  <a href="nightly/">Paper Scan</a>
  <a href="lab/">Lab</a>
  <a href="archive/">Archive</a>
</nav>
<header>
  <h1>AI Research Daily</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — Top picks today</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>Findings by topic</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== Replaced daily by the morning-report agent. ALL content in English. =====
const REPORT = {
  date: "2026-07-26",
  note: "Experiments: λ×gap headline-figure data landed (45 runs) — α=1 wins everywhere, on-policy RKL is purely harmful in the toy setting (mix50 loses to pure SeqKD even with a noisy teacher), rescue difficulty spikes at the capacity cliff; pythia track upgraded to the make-or-break experiment; narrative (a)/(b) awaiting your choice; runner offline 5th night — please restart · Paper scan: 10 items (Saturday, mostly lab releases and backfills)",
  runs: ["Experiment night shift 02:00 (cloud λ×gap headline figure + noisy-teacher)", "Paper scan 07:00 (10 items)"],
  tldr: [
    "Experiment milestone: OPD-Gap headline-figure data landed — λ-anchoring × capacity-gap, 45 runs + noisy-teacher variant. α=1 (pure SeqKD) is best everywhere; the on-policy reverse-KL component finds no beneficial regime in the toy setting (clean or noisy teacher alike). Recovery curves are non-monotonic in gap (concave at 7.6× / linear at 2.0× / convex at 28×) — rescue difficulty spikes near the capacity cliff; the tNLL objective-outcome divergence holds across the whole grid. Narrative direction (a) graded collapse vs (b) necessary-conditions study — awaiting your comment. Runner offline for the 5th night; please restart start.command.",
    "★4 Anthropic released Claude Opus 5 (backfill from 7/24): 1M context, $5/$25 — \"near-Fable-5 intelligence at half price\", five effort tiers (thinking forced at xhigh/max); first on Frontier-Bench; automated behavioral audits call it \"the most aligned model to date\" — alignment as a headline selling point for the first time.",
    "★4 [project-related] Apple, \"Unmasking On-Policy Distillation\": token-level \"ideal gradient\" + gradient-alignment score to diagnose when OPD helps vs hurts; distillation signal aligns far better on incorrect rollouts than correct ones — same family as our tNLL metric, different instrument. Must-cite in related work; tonight's must-read to check for a gap sweep.",
    "★3 Kimi K3 weights countdown to release 7/27 00:00 UTC: the \"15-day evidence gap\" is now the core counter-argument (\"detected distillation activity\" ≠ \"model trained by distillation\"); Moonshots podcast pushes open-weight irreversibility + guardrail attack-defense asymmetry. Once weights land, forensic methods become independently checkable for the first time.",
    "★3 Two poles of agent memory in one day: Sakana RHI iteratively self-improves the harness (low-effort beats max-effort, 60% cost cut); Duke PRO-LONG full-log + programmatic retrieval gets +18pp on ARC-AGI-3; AttriMem uses attribution as process reward to crack memory credit assignment."
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" },
    { name: "Multimodal/VLM", color: "--s6" }
  ],
  findings: [
    { topic: "Post-training", title: "Anthropic releases Claude Opus 5: 1M context, five effort tiers, \"near-Fable-5 intelligence at half price\"", url: "https://www.anthropic.com/news/claude-opus-5", type: "release", date: "2026-07-24", stars: 4,
      summary: "$5/$25 pricing, 1M ctx, 128K output, thinking on by default; five effort tiers (thinking cannot be disabled at xhigh/max — a breaking change) plus a 2×-price Fast mode. First across the board on Frontier-Bench v0.1 (double Opus 4.8), within 0.5% of Fable 5's CursorBench peak at half price, beats Fable 5 on OSWorld 2.0 at 1/3 cost; automated behavioral audits call it \"the most aligned model to date\"; new beta mid-conversation tool changes.",
      why: "Frontier intelligence halves in price again + alignment becomes a headline selling point; effort tiers and hot tool-swapping directly reshape agent deployment." },
    { topic: "OPD", title: "Apple: Unmasking On-Policy Distillation — token-level \"ideal gradient\" diagnosis of when OPD helps vs hurts", url: "https://machinelearning.apple.com/research/unmasking-on-policy-distillation", type: "paper", date: "2026-05 (blogged in July)", stars: 4,
      summary: "[project-related] Derives an \"ideal per-node gradient\", estimates it on long reasoning chains via targeted rollouts, and scores each distillation configuration by gradient alignment. Core finding: the distillation signal aligns with the ideal gradient far more on incorrect rollouts than correct ones (when the student is already right, teacher signal is near noise); the optimal configuration varies with student capacity and task — no universal recipe.",
      why: "Same problem as our project via a gradient-alignment route — same family as our tNLL metric, different instrument; must-cite. No controlled gap sweep visible in the blog, so our differentiation still stands." },
    { topic: "OPD", title: "Kimi K3 weights countdown to 7/27: 2.8T MoE details public; the \"15-day evidence gap\" becomes the core counter-argument", url: "https://memeburn.com/kimi-k3-distillation-2026-faces-a-15-day-evidence-gap/", type: "discussion", date: "2026-07-25", stars: 3,
      summary: "Weights due on HF 7/27 00:00 UTC: 2.8T sparse MoE (~50B active), KDA decoding 6.3×, 896 experts; #1 Arena coding Elo 1679 but TTFT 161s, hallucination rate up generationally 39%→51%. Forensics dispute centers on the \"15-day gap\": completing distillation→training→deployment in two weeks is considered technically implausible; the pro side cites 3.4M linked Claude interactions; key distinction — \"detected distillation activity\" ≠ \"the whole model was trained by distillation\".",
      why: "Once weights land on 7/27, cross-entropy fingerprinting and other forensic methods become independently checkable by anyone for the first time." },
    { topic: "AI Safety", title: "Moonshots podcast on the K3 release: irreversibility and the guardrail attack-defense asymmetry", url: "https://finance.biggo.com/news/409ddd2100883bc9", type: "discussion", date: "2026-07-25", stars: 2,
      summary: "A 2.8T open-weight release is irrevocable (\"once intelligence becomes software, geofencing is near-unenforceable\"); the White House sanction posture is read as pre-release negotiation leverage. Sharp case in point: in the HF intrusion forensics, US commercial models refused to analyze the attack payload due to guardrails while GLM 5.2 completed it — over-restriction hurts defenders.",
      why: "Open-weight irreversibility and guardrail asymmetry converge on the eve of the K3 release — a representative sample of the open-weight safety policy debate." },
    { topic: "Self-Evolving", title: "Sakana AI: Recursive Harness Self-Improvement — treating the harness as a prompt-level spec that iterates on itself", url: "https://arxiv.org/abs/2607.15524", type: "paper", date: "2026-07-17", stars: 3,
      summary: "RHI treats the agent scaffold as a prompt-level specification and refines task-specific harnesses via comparison feedback over revision history, without touching model weights; on 30 synthetic ML-research tasks, a low-reasoning-effort agent + a few iterations beats max-effort baselines with up to 60% inference-cost savings, plus an information-theoretic formalization.",
      why: "First output of Sakana's RSI Lab, landing right on the harness-evolution-efficacy debate; \"low effort + RHI beats max effort\" still needs an equal-budget baseline check." },
    { topic: "Self-Evolving", title: "PRO-LONG: programmatic memory gives coding agents +18pp on long-horizon ARC-AGI-3", url: "https://arxiv.org/abs/2607.20064", type: "paper", date: "2026-07-22", stars: 3,
      summary: "Duke: no lossy compression or retrieval — maintain a complete structured interaction log and let the coding agent query its own history with code. +18pp average on the ARC-AGI-3 public game set, up to 76.1% pass@1, 4.2–5.8× token savings; Fable 5 reaches 97.4% best@2. Code released.",
      why: "\"Record everything + programmatic retrieval\" and AttriMem's \"learn what to remember\" form the two poles of the memory problem; long-horizon context management is becoming the main battleground." },
    { topic: "Agentic RL", title: "AttriMem: attribution-guided process feedback cracks credit assignment in agent memory learning", url: "https://arxiv.org/abs/2607.21106", type: "paper", date: "2026-07-23", stars: 3,
      summary: "Memory construction dilemma: heuristics are subjective, RL suffers from coarse outcome rewards. AttriMem augments outcome reward with local rewards from token-level attribution (each memory item's contribution to the final answer); beats retrieval, heuristic, and RL baselines on long-horizon conversational QA, generalizes across benchmarks and answer models, and stabilizes RL.",
      why: "Using attribution as process reward for memory learning — another instance of memory management moving from heuristics to explicit optimization." },
    { topic: "Post-training", title: "(provenance confirmed) Thinking Machines Inkling: open-weight multimodal reasoning, built for Tinker fine-tuning", url: "https://thinkingmachines.ai/news/introducing-inkling/", type: "release", date: "2026-07-16", stars: 3,
      summary: "Their first open-weight model, now confirmed: efficient text/image/audio reasoning, full weights open and fine-tunable on Tinker same-day; Artificial Analysis rates it the strongest US open-weight model. Positioned as a customizable base rather than a flagship rival.",
      why: "First US-camp product strategy built on \"open weights + fine-tuning platform\"; another usable base for post-training research." },
    { topic: "Post-training", title: "Beyond Entropy: Correctness-Aware Advantage Shaping via Contrastive Policy Optimization", url: "https://arxiv.org/abs/2607.14614", type: "paper", date: "2026-07", stars: 2,
      summary: "Reshapes advantage estimation with contrastive signals (rather than pure entropy or pure outcome). (Abstract page rate-limited; details next round.)",
      why: "Advantage shaping is an active patch-point for GRPO-family stability; same \"criterion refinement\" trend as predictive divergence masks." },
    { topic: "Agentic RL", title: "Cura 1T: an agentic model specialized for medicine", url: "https://huggingface.co/papers/2607.15314", type: "paper", date: "2026-07", stars: 2,
      summary: "A 1T-class agentic model specialized for medical scenarios; 34 upvotes on HF this week. (Details to follow.)",
      why: "Domain-specialized agentic models (rather than general model + prompting) are emerging as a category; their post-training recipes are worth tracking." }
  ]
};
// ===== End of data block =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  "Overnight summary · " + REPORT.date + " · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "total findings" },
  { v: papers, k: "papers" },
  { v: REPORT.findings.length - papers, k: "blogs / discussions" },
  { v: REPORT.runs.length, k: "overnight runs" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "All";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="All"?"active":""}" onclick="setTopic('All')">All</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "All" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="importance ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>Why it matters:</b> ${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · experiment night shift 2:00 AM · paper scan 7:00 AM · daily report 9:00 AM (US Central) · full archives in the autoResearch_AI project (claude/daily/)";
</script>
</body>
</html>
