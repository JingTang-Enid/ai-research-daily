<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Daily</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
      --chip-bg: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 28px 20px 60px; max-width: 980px; margin: 0 auto;
  }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; font-size: 13px; flex-wrap: wrap; }
  nav .brand { font-weight: 700; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a.active { color: var(--ink); font-weight: 600; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 5px; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 30px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12.5px; }
  .barrow .lab { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bartrack { height: 14px; position: relative; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; }
  .barrow .num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tldr li { margin: 8px 0 8px 0; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
  .tldr { padding-left: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--ink-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--grid);
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stars { color: var(--s4); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
  .why { font-size: 12.5px; margin-top: 7px; color: var(--ink); }
  .why b { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<nav>
  <span class="brand">autoResearch_AI</span>
  <a href="./" class="active">Daily Report</a>
  <a href="nightly/">Paper Scan</a>
</nav>
<header>
  <h1>AI Research Daily</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="tiles" id="tiles"></div>

<div class="panel">
  <h2>TL;DR — Top picks today</h2>
  <ul class="tldr" id="tldr"></ul>
</div>

<div class="panel">
  <h2>Findings by topic</h2>
  <div id="topicbars"></div>
</div>

<div class="filters" id="filters"></div>
<div id="cards"></div>

<footer id="foot"></footer>

<script>
// ===== Replaced daily by the morning-report agent. ALL content in English. =====
const REPORT = {
  date: "2026-07-27",
  note: "Paper scan: 11 items across 7 topics (Sunday edition; Kimi K3 open weights actually shipped)",
  runs: ["Paper scan 07:00 (11 items)"],
  tldr: [
    "Kimi K3 open weights actually shipped — 2.8T MoE (16/896 experts active, 1M context, MXFP4 quantization-aware-trained) landed on Hugging Face at 00:00 UTC Jul 27. The distillation-provenance dispute moves from claims to physics: cross-entropy fingerprints and the \"15-day gap\" argument are now independently re-runnable by anyone with the hardware, and first independent evals (Semgrep) already show a precision gap behind frontier models.",
    "★4 [project-related] Direct-OPD (Tsinghua + ByteDance Seed): vanilla on-policy distillation DEGRADES students already stronger than the teacher (56.7%→~50%); distilling the teacher's RL-induced delta (log-prob difference between a checkpoint pair) fixes it — Qwen3-1.7B 48.3%→58.3% AIME at ~1/50 the compute of direct RL. The mirror image of OPD-Gap's axis: together they frame OPD viability as a two-sided window in capacity ratio. Must-cite.",
    "★4 Black Forest Labs FLUX 3: one Self-Flow backbone jointly generates image / 20s 720p video / native audio and doubles as a robot policy (FLUX-mimic, <80 ms on one RTX 5090) — the \"world model → policy\" convergence arriving from the generative side, on an open-weights track.",
    "★3 Structured output collapses answer diversity (Cornell Tech, 44 models): merely asking for JSON drops answer-choice surprisal 1.80→1.58 bits and pushes the modal answer from 41% to 64% of responses — a cheap-to-check confound for any post-training eval that uses formatted responses."
  ],
  topics: [
    { name: "Post-training", color: "--s1" },
    { name: "OPD", color: "--s2" },
    { name: "AI Safety", color: "--s3" },
    { name: "Agentic RL", color: "--s4" },
    { name: "Self-Evolving", color: "--s5" },
    { name: "Multimodal/VLM", color: "--s6" },
    { name: "MoE", color: "--s7" }
  ],
  findings: [
    { topic: "OPD", title: "Kimi K3 open weights released: 2.8T-parameter MoE lands on Hugging Face", url: "https://huggingface.co/moonshotai/Kimi-K3", type: "release", date: "2026-07-27", stars: 4,
      summary: "The largest open-weight model to date shipped on schedule despite the White House distillation accusations: 2.8T total parameters, Stable LatentMoE activating 16 of 896 experts (~1.8%/token), Kimi Delta Attention, 1M-token context, native multimodal, and quantization-aware training from the SFT stage (MXFP4 weights). Moonshot's own blog concedes it still trails Claude Fable 5 and GPT 5.6 Sol overall while claiming #1 on Frontend Code Arena (Elo 1679); self-hosting needs ~1.4-1.5TB VRAM. Post-training methodology still undisclosed.",
      why: "The provenance dispute moves from claims to physics — fingerprinting and the \"15-day gap\" argument can now be independently re-run against the actual weights, and the release is irreversible either way." },
    { topic: "OPD", title: "Direct-OPD: weak-to-strong generalization — vanilla OPD fails when the student outgrows the teacher", url: "https://arxiv.org/abs/2607.05394", type: "paper", date: "2026-07-08", stars: 4,
      summary: "[project-related] Tsinghua SIA-Lab + ByteDance Seed identify a capacity-direction failure mode: standard on-policy distillation conflates the teacher's RL gains with its intrinsic limitations, degrading a student already stronger than the teacher (R1-Distill-7B 56.7%→~50%). Direct-OPD instead extracts the implicit reward Δ = log π_post-RL − log π_pre-RL from a weak teacher's checkpoint pair and trains the student against that delta on its own rollouts. Qwen3-1.7B jumps 48.3%→58.3% on AIME 2024 at ~1/50 the compute of direct RL; deltas compose sequentially.",
      why: "The mirror image of OPD-Gap's axis (gap < 1 vs our gap ≫ 1) — together they frame OPD viability as a two-sided window in capacity ratio; must-cite, and its \"imitation imports teacher limitations\" mechanism contrasts with our anchoring account." },
    { topic: "OPD", title: "K3 first independent checks: Semgrep finds a precision gap; HN debates 2.8T serving economics", url: "https://news.ycombinator.com/item?id=49065752", type: "discussion", date: "2026-07-26", stars: 3,
      summary: "Semgrep's IDOR-detection benchmark puts K3 at 0.684 precision / 0.340 F1 vs 0.84-0.91 precision for frontier competitors, collapsing to ~6% F1 on large codebases — competitive aggregate numbers, major precision gap at enterprise scale. The HN release thread reads self-hosting costs (~1.5TB VRAM) against subsidy theories, and the community's first project is re-distilling K3 into 200B/20B consumer sizes.",
      why: "The K3 pattern is holding against the open weights — near-frontier on headline benchmarks, materially behind on precision-sensitive agentic work — and the first community instinct is to distill it smaller." },
    { topic: "OPD", title: "Denser ≠ Better: limits of on-policy self-distillation for continual post-training", url: "https://arxiv.org/abs/2607.01763", type: "paper", date: "2026-07", stars: 2,
      summary: "[project-related] Challenges the assumption that denser token-level self-distillation signals are uniformly better in the continual post-training setting. Abs page was rate-limited this round, so method and numbers are pending — flagged because \"limits of on-policy self-distillation\" sits directly on the OPD-failure-modes literature the draft cites.",
      why: "Another candidate for the OPD-failure-modes paragraph, alongside the privileged-context and gradient-alignment results; details to backfill next round." },
    { topic: "Post-training", title: "Structured output collapses answer diversity across 44 language models", url: "https://arxiv.org/abs/2607.18476", type: "paper", date: "2026-07-21", stars: 3,
      summary: "Cornell Tech re-ran a One-Word Census across 44 models: merely asking for JSON/XML/YAML output (no constrained decoding) drops mean answer-choice surprisal 1.80→1.58 bits, raises the modal answer from 41% to 64% of responses, and cuts distinct answers 52→36 — with the most distinctive models compressing most. One model's \"favorite color\" flips from 0% to 100% \"cerulean\" between chat and JSON registers.",
      why: "Nearly every agent pipeline consumes models through structured output, so deployed systems are systematically less diverse than the chat models that were evaluated — a cheap-to-check confound for formatted-response evals." },
    { topic: "Post-training", title: "GAMUT: two-level meta-rubrics for evaluating open-ended generation", url: "https://arxiv.org/abs/2607.19322", type: "paper", date: "2026-07-22", stars: 2,
      summary: "Proposes a two-level meta-rubric scheme for judging factual completeness of open-ended generation, positioned as a benchmark for rubric-based LLM-as-judge evaluation. (List-level information this round; abs page pending.)",
      why: "Rubric-based judging is quietly becoming the reward/eval substrate for open-ended post-training; standardized meta-rubrics would make those rewards auditable." },
    { topic: "AI Safety", title: "AI-assisted mathematics week: Jacobian Conjecture counterexample, Tsimerman joins OpenAI safety, Tao's ICM keynote", url: "https://champaignmagazine.com/2026/07/26/ai-by-ai-weekly-top-5-july-20-26-2026/", type: "discussion", date: "2026-07-19/24", stars: 3,
      summary: "Three linked events: Levent Alpöge announced a Claude-Fable-5-assisted counterexample to the 87-year-old Jacobian Conjecture; hours after receiving the 2026 Fields Medal, Jacob Tsimerman announced he is joining OpenAI's safety division, saying AI will surpass human mathematicians within two years; and Terence Tao's ICM keynote framed mathematics as moving \"from proof scarcity to proof abundance\", arguing community values must shift toward verification and exposition.",
      why: "Elite mathematicians simultaneously validating frontier-model capability and routing themselves into safety work is a capability-risk signal in its own right — and \"proof abundance\" is the same verification bottleneck safety evaluation is hitting." },
    { topic: "Agentic RL", title: "Is Progressive Disclosure All You Need for Long-Context Agents?", url: "https://arxiv.org/abs/2607.17598", type: "paper", date: "2026-07-20", stars: 3,
      summary: "Compares raw navigation vs flat vs hierarchical skill-pack disclosure on ∞Bench across three harnesses: disclosure only helps weak navigators on single documents, but at library scale (20 books) raw navigation collapses (En.QA 0.26) while flat disclosure holds (0.46); hierarchical packs never beat flat ones and can sharply hurt (En.MC 0.91→0.64).",
      why: "A clean negative result against ever-deeper skill/context hierarchies for agents, with a practical recipe: one level of indexing, only at scale — \"disclosure buys context, not intelligence\"." },
    { topic: "Self-Evolving", title: "Harness Handbook: making evolving agent harnesses readable, navigable, and editable", url: "https://arxiv.org/abs/2607.13285", type: "paper", date: "2026-07-14", stars: 3,
      summary: "Targets the behavior-to-code mapping problem in agent harness evolution: an automatically generated behavior-centric index plus behavior-guided progressive-disclosure navigation from behaviors down to implementation sites. Handbook-assisted planning improves edit localization and quality while cutting tokens, with the largest gains on scattered sites and cross-module interactions; validated on two open-source harnesses.",
      why: "Harness self-evolution keeps being criticized for unaccountable edits; tooling that makes harness changes legible is a prerequisite for that debate to resolve." },
    { topic: "Self-Evolving", title: "Recursive Self-Improvement in AI: from bounded self-refinement to autonomous research loops", url: "https://arxiv.org/abs/2607.07663", type: "paper", date: "2026-07-08", stars: 2,
      summary: "A survey/position piece organizing the RSI space from bounded self-refinement (prompt/harness iteration) through autonomous research loops, taxonomizing what actually recurses: weights, scaffolds, data, or objectives. (List-level information this round.)",
      why: "The field just acquired opposing evidence poles on harness evolution; a shared taxonomy of \"what recurses\" is what the argument currently lacks." },
    { topic: "Multimodal/VLM", title: "Black Forest Labs FLUX 3: one Self-Flow backbone for image, video, audio — and robot actions", url: "https://www.marktechpost.com/2026/07/26/black-forest-labs-releases-flux-3-a-multimodal-flow-model-for-image-video-audio-and-robot-action-prediction/", type: "release", date: "2026-07-26", stars: 4,
      summary: "FLUX 3 trains a single multimodal backbone with Self-Flow (flow matching + self-supervised feature reconstruction) jointly on images, video, and audio, generating up to 20s of 720p video with native synchronized audio; vendor human-preference wins of 93%/77%/69%/52% vs Luma Ray 3.2 / Runway Gen-4.5 / Grok Imagine / Seedance 2.0. The same backbone drives FLUX-mimic, a robot policy running under 80 ms on a single RTX 5090; open weights promised.",
      why: "First frontier-lab attempt to unify generative video/audio and robot action in one open-weights-track backbone — the \"world model → policy\" convergence arriving from the generative side rather than the VLA side." }
  ]
};
// ===== End of data block =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((REPORT.topics.find(x => x.name === t) || {color:"--muted"}).color);

document.getElementById("subtitle").textContent =
  "Overnight summary · " + REPORT.date + " · " + REPORT.note;

const byTopic = {};
REPORT.topics.forEach(t => byTopic[t.name] = 0);
REPORT.findings.forEach(f => byTopic[f.topic] = (byTopic[f.topic] || 0) + 1);
const papers = REPORT.findings.filter(f => f.type === "paper").length;

document.getElementById("tiles").innerHTML = [
  { v: REPORT.findings.length, k: "total findings" },
  { v: papers, k: "papers" },
  { v: REPORT.findings.length - papers, k: "blogs / discussions" },
  { v: REPORT.runs.length, k: "overnight runs" }
].map(t => `<div class="tile"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("");

document.getElementById("tldr").innerHTML =
  REPORT.tldr.map(t => `<li>${t}</li>`).join("");

const maxN = Math.max(...Object.values(byTopic), 1);
document.getElementById("topicbars").innerHTML = REPORT.topics.map(t => `
  <div class="barrow">
    <span class="lab">${t.name}</span>
    <div class="bartrack"><div class="bar" style="width:${(byTopic[t.name]/maxN)*100}%;background:${css(t.color)}"></div></div>
    <span class="num">${byTopic[t.name]}</span>
  </div>`).join("");

let active = "All";
function renderFilters() {
  document.getElementById("filters").innerHTML =
    [`<button class="chip ${active==="All"?"active":""}" onclick="setTopic('All')">All</button>`]
    .concat(REPORT.topics.map(t =>
      `<button class="chip ${active===t.name?"active":""}" onclick="setTopic('${t.name}')">
         <span class="dot" style="background:${css(t.color)}"></span>${t.name} (${byTopic[t.name]})</button>`)).join("");
}
function renderCards() {
  const list = REPORT.findings
    .filter(f => active === "All" || f.topic === active)
    .slice().sort((a,b) => b.stars - a.stars);
  document.getElementById("cards").innerHTML = list.map(f => `
    <div class="card" style="border-left-color:${colorOf(f.topic)}">
      <div class="top">
        <h3><a href="${f.url}" target="_blank" rel="noopener">${f.title}</a></h3>
        <span class="stars" title="importance ${f.stars}/5">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)}</span>
      </div>
      <div class="meta"><span class="tag">${f.topic}</span><span>${f.type}</span><span>${f.date}</span></div>
      <p>${f.summary}</p>
      <div class="why"><b>Why it matters:</b> ${f.why}</div>
    </div>`).join("");
}
function setTopic(t) { active = t; renderFilters(); renderCards(); }
renderFilters(); renderCards();

document.getElementById("foot").textContent =
  "autoResearch_AI · paper scan 7:00 AM · daily report 9:00 AM (US Central) · full archives in the autoResearch_AI project (claude/daily/)";
</script>
</body>
</html>
